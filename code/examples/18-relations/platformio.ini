; ESP32-C5-DevKitC-1-N8R8 向け。
; ESP32-C5 は公式の platform-espressif32 では未対応なので、pioarduino のフォークを使う。
; （C5のArduino対応は arduino-esp32 3.3系 / ESP-IDF 5.5 以降）
[env:esp32-c5-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; N8R8 用のボード定義はまだないので、フラッシュ容量（8MB）とPSRAM有りが一致する
; N8R4 を使う。PSRAMの容量は起動時に検出されるため実害はない。
; PSRAMで問題が出たら board = esp32-c5-devkitc-1（4MB・PSRAMなし）に下げる。
board = esp32-c5-devkitc1-n8r4
framework = arduino
monitor_speed = 115200
build_flags = -Wall
