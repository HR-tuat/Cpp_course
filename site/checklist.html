  <script>
    // 保存済みのテーマと表示対象者を描画前に適用する（切り替え時のちらつき防止）
    try {
      var t = localStorage.getItem('cpp-course:theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      var k = localStorage.getItem('cpp-course:teacher-key');
      var a = localStorage.getItem('cpp-course:audience');
      if (k) document.documentElement.dataset.teacher = '';
      document.documentElement.dataset.audience = k && a === 'teacher' ? 'teacher' : 'student';
    } catch (e) {
      document.documentElement.dataset.audience = 'student';
    }
  </script>
